.part:after{content:"";pointer-events:none;position:absolute;inset:4px;border:1px solid #7d583f6e}.part.locked{filter:grayscale(.78);opacity:.58}.part-thumb{flex:0 0 100px;width:100px;background:#21303a;border:1px solid #7a5d3b;overflow:hidden;position:relative}.part-thumb img{width:100%;height:100%;object-fit:cover;object-position:center;filter:contrast(1.12)}.part.locked .part-thumb:after{content:"⌑";position:absolute;inset:0;display:grid;place-items:center;color:#f4dfb3;font:44px var(--serif);background:#0b1b287b}.part-info{flex:1;min-width:0;padding:3px 19px 5px 0;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center}.part-info em{align-self:flex-start;font:700 10px/1.5 var(--sans);letter-spacing:1.2px;color:#f9e9cb;background:#87261e;padding:1px 8px;text-transform:uppercase;font-style:normal}.part-info strong{font:bold clamp(19px,5vw,25px)/1.1 var(--serif);margin:7px 0 4px}.part-info small{font:12px/1.3 var(--serif);color:#574f44}.part-go{position:absolute;right:10px;top:43%;z-index:2;color:#822f20;font:27px var(--serif)}.chapter-footer{padding:4px 27px;color:#a5b5b4;font-size:12px;line-height:1.5;margin:2px 0 0}.chapter-next{margin:10px 24px 18px;border-top:1px solid var(--rule);padding-top:18px;color:#b5c2bc;font:italic 17px/1.3 var(--serif)}

.story-panel{position:relative;z-index:3;margin:0 12px 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));background-color:var(--paper);background-image:radial-gradient(circle at 22% 29%,#ae895117 0 1px,transparent 2px),repeating-linear-gradient(165deg,#a0753910 0 1px,transparent 1px 10px);background-size:19px 19px,100%;box-shadow:0 -6px 0 #0b1927,0 0 0 2px #c9a879,5px 0 18px #0004;color:#152834;clip-path:polygon(0 11px,4% 7px,9% 10px,15% 2px,23% 8px,31% 3px,40% 10px,52% 1px,61% 7px,70% 2px,79% 8px,89% 4px,100% 11px,100% 100%,0 100%);max-height:61svh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#b78a56 transparent}.story-panel:before{content:"";position:absolute;inset:16px 10px 10px;border:1px solid #8b6e4436;pointer-events:none}.panel-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-top .eyebrow{letter-spacing:1.3px;font-size:10px;color:#82271f}.panel-step{font:italic bold 17px var(--serif);color:#835942}.story-panel p.scene-text{position:relative;white-space:pre-line;margin:0 0 19px;color:#182730;font:normal clamp(19px,5.7vw,24px)/1.38 var(--serif);letter-spacing:-.18px}.scene-text:first-letter{font-weight:700}.scene-note{position:relative;padding:7px 10px;margin-bottom:14px;border-left:3px solid #a45b37;color:#695e50;font:13px/1.47 var(--serif)}.panel-actions{position:relative;display:flex;align-items:stretch;gap:10px}.panel-actions>.btn{flex:1}.subtle-btn{flex:0 0 48px;border:1px solid #a8804f;background:#f9e9ca;color:#183044;font-size:22px;border-radius:3px}.choices{width:100%;display:grid;gap:12px}.choice{position:relative;display:block;width:100%;background:#f5e3c2;border:2px solid #8a613a;box-shadow:inset 0 0 0 2px #e1c9a0,0 3px 0 #9b7850;color:#162b37;padding:12px 33px 12px 14px;min-height:64px;text-align:left;transition:transform .14s}.choice:after{content:'›';position:absolute;right:11px;top:50%;transform:translateY(-50%);font:32px var(--serif);color:#84221a}.choice strong{font:700 16px/1.22 var(--serif);display:block}.choice small{display:block;margin-top:6px;color:#6c5a48;font:12px/1.25 var(--sans)}.part-end .story-panel{min-height:270px}.end-emblem{font:42px/.9 var(--serif);color:#8e3022;margin:0 0 15px;text-align:center}
/* Journal */
.journal-view{padding-bottom:calc(25px + env(safe-area-inset-bottom))}.journal-header{padding:18px 25px 8px}.journal-header h1{font:normal bold 41px/.94 var(--serif);margin:14px 0;color:#f3d7a8}.journal-description{font:14px/1.65 var(--sans);color:#b4bdaf;margin:0 0 30px}.milestone{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--rule)}.milestone .index{flex:0 0 48px;font:italic bold 28px var(--serif);color:var(--gold)}.milestone strong{font:normal bold 17px/1.2 var(--serif);color:#f2dfbd}.milestone p{margin:6px 0 0;color:#bbc4be;font:13px/1.45 var(--sans)}.journal-empty{border:1px dashed #96794d8a;padding:17px;margin:17px 0;color:#b4bfbd;font:13px/1.6 var(--sans)}
#toast{position:fixed;bottom:25px;left:50%;max-width:min(500px,90vw);width:max-content;padding:12px 16px;transform:translate(-50%,15px);border:1px solid #b58d54;background:#10283a;color:#f4d7a7;box-shadow:0 6px 18px #000a;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;z-index:20;font-size:13px}#toast.show{opacity:1;transform:translate(-50%,0)}.loading{display:grid;place-content:center;min-height:100svh;text-align:center}.loading div{font:bold italic 50px var(--serif);color:var(--paper)}.loading small{font-size:12px;color:#d6b77b}.errorbox{margin:18px 25px;padding:22px;border:1px solid #a4875c;color:#f4e2c1}.errorbox h2{font:26px var(--serif)}
@media(min-width:700px){body{padding:20px;background:repeating-linear-gradient(120deg,#091523 0 28px,#0a1b2a 29px 30px)}.shell{border:1px solid #d0ae6d99;min-height:calc(100svh - 40px);border-radius:12px}.page,.reader,.loading{min-height:calc(100svh - 40px)}.home-view{min-height:calc(100svh - 40px)}.reader-hud{padding-top:19px}}
@media(max-height:760px){.home-brand h1{font-size:72px}.home-brand{margin-bottom:10px}.home-actions{gap:8px}.home-actions .btn{min-height:45px}.home-foot{margin-top:10px}.story-panel{max-height:65svh;padding-top:20px}.story-panel p.scene-text{font-size:19px;line-height:1.3}.reader-center{min-height:45px;padding-bottom:8px}.choice{min-height:54px}.chapter-hero{min-height:220px}}
@media(max-width:345px){.home-view{padding-left:18px;padding-right:18px}.home-brand h1{font-size:68px}.chapter-section{padding-left:17px;padding-right:17px}.part-thumb{width:80px;flex-basis:80px}.story-panel{margin:0 8px;padding-left:16px;padding-right:16px}.story-panel p.scene-text{font-size:19px}}

// Только для полностью автономной демонстрации.
const __stories = [{"id":"three-years-to-home","collection":"АРМЕЙСКИЕ ИСТОРИИ","title":"Три года до дома","shortDescription":"1990 год. Из Минска — в Севастополь. Начало трёх лет службы на атомной подводной лодке.","genre":"Реальные воспоминания","duration":"10–12 минут","cover":"/assets/comic-v2/cover.webp","start":"c1p1-01","chapters":[{"number":1,"name":"Начало службы","subtitle":"Призыв. Дорога. Севастополь.","poster":"/assets/comic-v2/enlist.webp","parts":[{"number":1,"title":"Дорога в Севастополь","subtitle":"19–21 ноября 1990 года","start":"c1p1-01","sceneCount":9,"published":true},{"number":2,"title":"Экзамен у морпехов","subtitle":"25 ноября 1990 года","start":"c1p2-01","sceneCount":7,"published":true},{"number":3,"title":"Водолазы уже уехали","subtitle":"Вечер 25 ноября 1990 года","start":"c1p3-01","sceneCount":7,"published":true}]},{"number":2,"name":"Следующая глава","subtitle":"Сюжет ещё не записан","poster":"/assets/comic-v2/submarine.webp","parts":[]}],"scenes":[{"id":"c1p1-01","chapter":1,"part":1,"background":"station","type":"narration","label":"19 НОЯБРЯ · РАННЕЕ УТРО","text":"19 ноября 1990 года, ранним утром, нас увезли в областной военкомат. С этого утра и началась моя дорога на флот.","next":"c1p1-02"},{"id":"c1p1-02","chapter":1,"part":1,"background":"paper","type":"narration","label":"ОБЛАСТНОЙ ВОЕНКОМАТ","text":"Там я узнал: меня забирают в Военно-морской флот. Служить придётся целых три года. Услышал это — и на душе сразу стало тяжело. Накатила тоска.","next":"c1p1-03"},{"id":"c1p1-03","chapter":1,"part":1,"background":"train","type":"narration","label":"19 НОЯБРЯ · ВЕЧЕР","text":"Вечером нас посадили на поезд. Из Минска — в Симферополь, а оттуда дальше, в Севастополь. Дорога к месту службы только начиналась.","next":"c1p1-04"},{"id":"c1p1-04","chapter":1,"part":1,"background":"train","type":"choice","label":"В ДОРОГЕ","text":"Поезд увозил нас всё дальше на юг. В памяти остались и сам маршрут, и настроение ребят, которым предстояло служить три года. Что рассмотреть ближе?","choices":[{"id":"route","text":"Посмотреть путь","hint":"Минск → Симферополь → Севастополь","effects":{"route":1},"next":"c1p1-05a","summary":"Ты рассмотрел маршрут."},{"id":"mood","text":"Узнать, как ехали призывники","hint":"Атмосфера в поезде","effects":{"mood":1},"next":"c1p1-05b","summary":"Ты обратил внимание на настроение в поезде."}]},{"id":"c1p1-05a","chapter":1,"part":1,"background":"route","type":"archive","label":"МАРШРУТ · ПО ВОСПОМИНАНИЯМ","text":"Минск. Потом Симферополь. И, наконец, Севастополь. Таков был маршрут, с которого начиналась служба.","note":"Год призыва уточнён позднее: 1990. Пункты маршрута — из исходных воспоминаний.","next":"c1p1-06"},{"id":"c1p1-05b","chapter":1,"part":1,"background":"train","type":"archive","label":"АТМОСФЕРА · В ПОЕЗДЕ","text":"Три года службы — для многих это известие было тяжёлым. В вагоне находились те, кто пытался утопить свою тоску в спиртном.","note":"Это деталь из воспоминаний, а не описание поступков рассказчика.","next":"c1p1-06"},{"id":"c1p1-06","chapter":1,"part":1,"background":"train","type":"narration","label":"ПОЕЗД · НА ЮГ","text":"В поезде многие переживали из-за трёх лет службы. Кто-то пытался заглушить это горе спиртным. Так мы и ехали на юг — навстречу неизвестной ещё жизни.","next":"c1p1-07"},{"id":"c1p1-07","chapter":1,"part":1,"background":"sea","type":"narration","label":"21 НОЯБРЯ · НОЧЬ","text":"21 ноября, уже ночью, мы прибыли в Севастополь. Нас отправили на распределительный пункт. Дорога закончилась. Служба только начиналась.","next":"c1p1-08"},{"id":"c1p1-08","chapter":1,"part":1,"background":"barracks","type":"narration","label":"РАСПРЕДЕЛИТЕЛЬНЫЙ ПУНКТ","text":"В казарме были ребята, приехавшие из разных уголков Советского Союза. Нас уложили вместе с ними — всех, кто только что прибыл.","next":"c1p1-09"},{"id":"c1p1-09","chapter":1,"part":1,"background":"barracks","type":"narration","label":"ПЕРВАЯ НОЧЬ В КАЗАРМЕ","text":"Спали прямо в одежде. Мне достался второй ярус. Эту первую ночь в Севастополе я запомнил именно такой.","next":"c1p1-end"},{"id":"c1p1-end","chapter":1,"part":1,"background":"barracks","type":"part_end","label":"ГЛАВА 01 · ЧАСТЬ 01","text":"Севастополь. Казарма. Второй ярус кровати и одежда, которую даже не снимали. Так закончилась первая часть этой истории. Через несколько дней мной неожиданно заинтересуются морские пехотинцы.","next":"c1p2-01"},{"id":"c1p2-01","chapter":1,"part":2,"background":"marineOffer","type":"narration","label":"25 НОЯБРЯ · РАСПРЕДЕЛИТЕЛЬНЫЙ ПУНКТ","text":"25 ноября моим личным делом заинтересовались офицеры морской пехоты. Вскоре ко мне подошёл капитан-лейтенант — уверенный, весёлый и явно уже что-то задумавший.","next":"c1p2-02"},{"id":"c1p2-02","chapter":1,"part":2,"background":"marineOffer","type":"narration","label":"РАЗГОВОР С КАПИТАН-ЛЕЙТЕНАНТОМ","text":"Он спросил: «Ты был тренером по тхэквондо? И хочешь служить в морской пехоте?» Я ответил честно: тренером был, а насчёт службы пока не знаю.","note":"Капитан-лейтенант решил, что лучший способ выяснить остальное — устроить маленький экзамен.","next":"c1p2-03"},{"id":"c1p2-03","chapter":1,"part":2,"background":"sparring","type":"narration","label":"КАЗАРМА · ПРОВЕРКА В БОЮ","text":"Меня отвели в казарму. Офицер предложил спарринг. Вокруг сразу собрались высокие и крепкие морские пехотинцы — зрителей набралось быстрее, чем участников.","next":"c1p2-04"},{"id":"c1p2-04","chapter":1,"part":2,"background":"sparring","type":"narration","label":"ПЕРВЫЙ РАУНД","text":"Я сразу пошёл в атаку и сбил офицера с ног. Он такого не ожидал. Поднялся, поправил форму и тут же предложил ещё один поединок.","note":"По выражению лиц вокруг было понятно: проверка внезапно стала очень интересной.","next":"c1p2-05"},{"id":"c1p2-05","chapter":1,"part":2,"background":"sparring","type":"narration","label":"ВТОРОЙ РАУНД","text":"Я понял: если выиграю и сейчас, будет третий раунд, потом четвёртый — и так до отбоя. Поэтому решил дать офицеру победить, чтобы все увидели достойный финал.","next":"c1p2-06"},{"id":"c1p2-06","chapter":1,"part":2,"background":"sparring","type":"narration","label":"ЭКЗАМЕН ЗАКОНЧЕН","text":"Так и сделал — проиграл ему. По лицу капитан-лейтенанта было видно: результатом он доволен. И раунд выиграл, и авторитет на месте.","next":"c1p2-07"},{"id":"c1p2-07","chapter":1,"part":2,"background":"marineOffer","type":"narration","label":"ПРЕДЛОЖЕНИЕ","text":"Капитан-лейтенант показал мне моё личное дело и сказал, что экзамен я прошёл: он может взять меня к себе в часть. Я попросил время до вечера, чтобы подумать.","next":"c1p2-end"},{"id":"c1p2-end","chapter":1,"part":2,"background":"marineOffer","type":"part_end","label":"ГЛАВА 01 · ЧАСТЬ 02","text":"Экзамен у морпехов был сдан. Оставалось решить главное: соглашаться ли на службу, где таких «экзаменов» могло оказаться ещё очень много.","next":"c1p3-01"},{"id":"c1p3-01","chapter":1,"part":3,"background":"decision","type":"narration","label":"25 НОЯБРЯ · ВЕЧЕР","text":"Вечером за мной пришли узнать ответ. Я ещё раз всё обдумал: драк мне хватило и до армии, а морская пехота представлялась местом, где побоища и жёсткая дедовщина могли стать обычным делом.","next":"c1p3-02"},{"id":"c1p3-02","chapter":1,"part":3,"background":"decision","type":"narration","label":"МОЙ ОТВЕТ","text":"Я ответил: «Нет». Морпехи удивились, но спорить не стали. Моё личное дело вернули и сказали отнести документы офицеру в штаб.","next":"c1p3-03"},{"id":"c1p3-03","chapter":1,"part":3,"background":"diversMissed","type":"narration","label":"ШТАБ","text":"Я пришёл в штаб и передал документы офицеру. Там неожиданно выяснилось: меня хотели в тот же день отправить в учебную часть, где готовили водолазов.","next":"c1p3-04"},{"id":"c1p3-04","chapter":1,"part":3,"background":"diversMissed","type":"narration","label":"ОПОЗДАЛ НА НЕСКОЛЬКО ЧАСОВ","text":"Но группа уже уехала. Пока я сдавал экзамен, думал и отказывался от морской пехоты, мои возможные товарищи-водолазы успели отправиться без меня.","note":"Вот так одно решение сразу закрыло одну дверь — а другая успела уехать на автобусе.","next":"c1p3-05"},{"id":"c1p3-05","chapter":1,"part":3,"background":"diversMissed","type":"narration","label":"СЛЕДУЮЩЕЕ РАСПРЕДЕЛЕНИЕ","text":"Мне сказали ждать следующего назначения. Личное дело снова легло в стопку, а я остался на распределительном пункте — уже без морской пехоты и без учебной части водолазов.","next":"c1p3-06"},{"id":"c1p3-06","chapter":1,"part":3,"background":"harbor","type":"narration","label":"СЕВАСТОПОЛЬ · КОНЕЦ ДНЯ","text":"Утром меня проверяли в бою, днём приглашали в часть, вечером я отказался, а потом узнал, что опоздал к водолазам. Для одного дня событий получилось с запасом.","next":"c1p3-07"},{"id":"c1p3-07","chapter":1,"part":3,"background":"harbor","type":"narration","label":"ВПЕРЕДИ — НЕИЗВЕСТНОСТЬ","text":"Армия только начиналась. Впереди было ещё много неожиданного. Главное — не сломаться, не потерять человеческое и дождаться своего следующего распределения.","next":"c1p3-end"},{"id":"c1p3-end","chapter":1,"part":3,"background":"harbor","type":"part_end","label":"ГЛАВА 01 · ЧАСТЬ 03","text":"Так необычно прошёл этот день: морпехи, два раунда, отказ и уехавшие водолазы. Моё настоящее место службы всё ещё ждало впереди.","next":null}]}];
const __key = 'history-offline-preview-v2';
const __read = () => {
 try { return JSON.parse(localStorage.getItem(__key) || 'null'); } catch { return null; }
};
const __save = p => { localStorage.setItem(__key, JSON.stringify(p)); };
const __new = () => ({ nodeId:__stories[0].start, stats:{route:0,mood:0}, decisions:[], visited:[__stories[0].start] });
const __scene = id => __stories[0].scenes.find(s=>s.id===id);
const __summary = p => {
 const s=__stories[0],c=__scene(p.nodeId);
 const chapters=s.chapters.map(ch=>({...ch,parts:ch.parts.map(part=>({...part,status:!part.published?'upcoming':p.visited.some(id=>{const i=__scene(id);return i.chapter===ch.number&&i.part===part.number})?(c.type==='part_end'?'done':'current'):'available'}))}));
 return {...s,scenes:undefined,chapters,currentChapter:c.chapter,currentPart:c.part,partCompleted:c.type==='part_end',started:p.visited.length>1,decisionsCount:p.decisions.length};
};
const __progress = p => {
 const s=__stories[0],scene=__scene(p.nodeId),chapter=s.chapters.find(c=>c.number===scene.chapter),part=chapter.parts.find(part=>part.number===scene.part);
 const n=p.visited.filter(id=>{const i=__scene(id);return i.chapter===scene.chapter&&i.part===scene.part}).length;
 return {storyId:s.id,storyTitle:s.title,scene,chapter:{number:chapter.number,name:chapter.name},part:{number:part.number,title:part.title,subtitle:part.subtitle},partProgress:scene.type==='part_end'?100:Math.min(99,Math.round(n/part.sceneCount*100)),visitedCount:p.visited.length,canGoBack:p.visited.length>1,decisions:p.decisions,stats:p.stats,partCompleted:scene.type==='part_end'};
};
const __advance = (p,body) => {
 const c=__scene(p.nodeId);
 if (c.id!==body.nodeId || c.type==='part_end') throw new Error('Переход недоступен');
 const stats={...p.stats},decisions=[...p.decisions];
 let next=c.next;
 if(c.type==='choice') {
   const ch=c.choices.find(ch=>ch.id===body.choiceId);
   if(!ch) throw new Error('Выберите вариант');
   for(const [key,value] of Object.entries(ch.effects||{}))stats[key]=(stats[key]||0)+value;
   next=ch.next;
   decisions.push({sceneId:c.id,choiceId:ch.id,summary:ch.summary,chapter:c.chapter,part:c.part});
 }
 return {nodeId:next,stats,decisions,visited:[...p.visited,next]};
};
const __back = p => {
 if(p.visited.length<2)return __new();
 const last=p.visited.at(-2);let restored=__new();let i=0;
 while(restored.nodeId!==last&&i++<30){const old=restored.nodeId;const ch=p.decisions.find(d=>d.sceneId===old);restored=__advance(restored,{nodeId:old,choiceId:ch?.choiceId});}
 return restored;
};
window.fetch = async (url,opts={}) => {
  const ok=payload=>({ok:true,status:200,json:async()=>payload});
  const err=message=>({ok:false,status:409,json:async()=>({error:message})});
  try {
   if(url==='/api/config')return ok({demoMode:true,gameName:'HIStory'});
   if(url==='/api/bootstrap')return ok({user:{name:'Читатель',demo:true},stories:__stories.map(s=>__summary(__read()||__new()))});
   if(url.endsWith('/reset')){const p=__new();__save(p);return ok(__progress(p));}
   if(url.endsWith('/advance')){const p=__advance(__read()||__new(),JSON.parse(opts.body||'{}'));__save(p);return ok(__progress(p));}
   if(url.endsWith('/back')){const p=__back(__read()||__new());__save(p);return ok(__progress(p));}
   if(url.startsWith('/api/story/'))return ok(__progress(__read()||__new()));
   return err('Неизвестный адрес');
  } catch(e) { return err(e.message); }
};

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]);
const haptic = () => { try { tg?.HapticFeedback?.impactOccurred?.('light'); } catch { /* optional */ } };
let toastTimer;
function toast(message) {
  toastNode.textContent = message;
  toastNode.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastNode.classList.remove('show'), 3800);
}
async function api(path, options = {}) {
  const headers = { 'X-Demo-Id': demoId, ...options.headers };
  if (tg?.initData) headers['X-Telegram-Init-Data'] = tg.initData;
  if (options.body) headers['Content-Type'] = 'application/json';
  const response = await fetch(path, { ...options, headers });
  let payload = null;
  try { payload = await response.json(); } catch { /* errors below */ }
  if (!response.ok) throw new Error(payload?.error || `Ошибка запроса (${response.status})`);
  return payload;
}
async function boot() {
  try {
    state.config = await api('/api/config');
    const data = await api('/api/bootstrap');
    state.user = data.user;
    state.stories = data.stories;
    state.story = data.stories[0];
    state.view = 'library';
    state.error = null;
    render();
  } catch (error) {
    state.error = error.message;
    state.view = 'error';
    render();
  }
}
function brand() {
  return `<div class="logo" aria-label="HIStory"><span class="logo-mark" aria-hidden="true">⚓</span><div class="logo-label">HI<span>Story</span></div></div>`;
}
function header(back = 'library', actionLabel = 'Главная') {
  return `<header class="topbar"><button class="backlink" data-action="${back}" aria-label="${escapeHtml(actionLabel)}"><i>‹</i>${escapeHtml(actionLabel)}</button>${brand()}<button class="iconbtn" data-action="journal" title="Дневник истории" aria-label="Дневник истории">☷</button></header>`;
}
function libraryView() {
  const story = state.story;
  if (!story) return `<div class="errorbox">История пока недоступна.</div>`;
  const chapter = story.chapters[0], part = chapter.parts[0];
  return `<main class="page home-view">
    <img class="home-art" src="${escapeHtml(story.cover)}" alt="Иллюстрация советского моряка и Севастополя в стиле графической новеллы"/>
    <div class="home-top"><span class="home-emblem" aria-hidden="true">⚓</span><span class="home-period">1990—1993</span></div>
    <section class="home-brand" aria-label="HIStory. Три года до дома">
      <h1>HI<span>Story</span></h1>
      <p class="home-tagline">Три года до дома</p>
      <p class="home-subtitle">Воспоминания о службе на атомной подводной лодке</p>
    </section>
    <nav class="home-actions" aria-label="Меню истории">
      <button class="btn wide" data-action="read"><span class="btn-icon">▸</span><span class="btn-copy">${story.started ? 'Продолжить' : 'Начать историю'}</span><span class="arrow">›</span></button>
      <button class="btn btn-paper btn-small wide" data-action="chapters"><span class="btn-icon">☷</span><span class="btn-copy">Главы и части</span><span class="arrow">›</span></button>
      <button class="btn btn-paper btn-small wide" data-action="journal"><span class="btn-icon">✦</span><span class="btn-copy">Дневник истории</span><span class="arrow">›</span></button>
    </nav>
    <div class="home-foot"><span>ГЛАВА 01</span><span aria-hidden="true">⚓</span><span>${escapeHtml(part.title)}</span></div>
  </main>`;
}
function chaptersView() {
  const story=state.story, chapter=story.chapters[0];
  const parts=chapter.parts.map(part=>{
    const locked=['upcoming','locked'].includes(part.status);
    const status=part.status==='done'?'Прочитано':part.status==='upcoming'?'Скоро':part.status==='locked'?'После предыдущей части':part.status==='current'&&story.started?'В процессе':'Доступно';
    const covers={1:'/assets/comic-v2/enlist.webp',2:'/assets/comic-v2/sparring.webp',3:'/assets/comic-v2/divers-missed.webp'};
    const cover=covers[part.number]||'/assets/comic-v2/submarine.webp';
    return `<button class="part ${locked?'locked':''}" data-action="${locked?'locked':'read'}" data-part="${part.number}" ${locked?'disabled':''} aria-label="Часть ${part.number}. ${escapeHtml(part.title)}. ${status}">
      <span class="part-thumb"><img src="${cover}" alt="" loading="lazy"></span><span class="part-info"><em>Часть ${String(part.number).padStart(2,'0')} · ${status}</em><strong>${escapeHtml(part.title)}</strong><small>${escapeHtml(part.subtitle)}</small></span><span class="part-go" aria-hidden="true">${locked?'⌑':'›'}</span>
    </button>`;
  }).join('');
  return `<main class="page chapter-view">${header('library','Главная')}
    <section class="chapter-hero"><img src="${escapeHtml(chapter.poster)}" alt="Военно-морской пейзаж Севастополя"/><div class="chapter-hero-text"><div class="kicker">${escapeHtml(story.collection)} · ГЛАВА ${String(chapter.number).padStart(2,'0')}</div><h1>${escapeHtml(chapter.name)}</h1><p>${escapeHtml(chapter.subtitle)}</p><div class="anchor-rule" aria-hidden="true">⚓</div></div></section>
    <section class="chapter-section"><div class="section-title"><h2>Части главы</h2><span class="tiny">01 / ${String(chapter.parts.length).padStart(2,'0')}</span></div>${parts}</section>
    <p class="chapter-footer">Части открываются по порядку. События основаны на личных воспоминаниях и не меняются читательским выбором.</p>
    <div class="chapter-next">⚓ &nbsp; 1990—1993 · Атомный подводный флот</div>
  </main>`;
}
function readerView() {
  const p=state.progress, scene=p.scene, end=scene.type==='part_end', isChoice=scene.type==='choice';
  const image=art[scene.background]||art.cover;
  const step=String(Math.min(p.visitedCount,99)).padStart(2,'0');
  const actions=end
    ? scene.next
      ? `<button class="btn wide" data-action="next"><span class="btn-copy">Начать часть ${scene.part + 1}</span><span class="arrow">→</span></button><button class="subtle-btn" data-action="chapters" aria-label="К частям главы">☷</button>`
      : `<button class="btn wide" data-action="chapters"><span class="btn-copy">К частям главы</span><span class="arrow">›</span></button><button class="subtle-btn" data-action="restart" aria-label="Начать заново">↻</button>`
    : isChoice
      ? `<div class="choices">${scene.choices.map(c=>`<button class="choice" data-action="choice" data-choice="${escapeHtml(c.id)}"><strong>${escapeHtml(c.text)}</strong><small>${escapeHtml(c.hint)}</small></button>`).join('')}</div>`
      : `<button class="btn wide" data-action="next"><span class="btn-copy">${scene.type==='archive'?'Продолжить':'Далее'}</span><span class="arrow">→</span></button>`;
  return `<main class="reader ${end?'part-end':''}">
    <div class="scene-art"><img src="${escapeHtml(image)}" alt="Иллюстрация к эпизоду: ${escapeHtml(scene.label)}"/></div>
    <div class="reader-hud"><button class="iconbtn" data-action="chapters" aria-label="Вернуться к главам">‹</button>
      <div class="reader-count"><div class="chapter-label"><span>Глава ${p.chapter.number} · часть ${p.part.number}</span><span>${p.partProgress}%</span></div><div class="progress-track" role="progressbar" aria-label="Прогресс части" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.partProgress}"><div class="progress-fill" style="width:${p.partProgress}%"></div></div></div>
      <button class="iconbtn" data-action="journal" aria-label="Дневник истории" title="Дневник">☷</button></div>
    <div class="reader-center"><div class="scene-place"><span>${escapeHtml(scene.label)}</span><small>${escapeHtml(p.part.title)}</small></div></div>
    <section class="story-panel" aria-label="Текущая сцена"><div class="panel-top"><span class="eyebrow">${end?'Часть завершена':scene.type==='archive'?'Из воспоминаний':isChoice?'Выбери, что узнать':'От первого лица'}</span><span class="panel-step">${end?'⚓':step}</span></div>
      ${end?'<div class="end-emblem" aria-hidden="true">⚓</div>':''}<p class="scene-text">${escapeHtml(scene.text)}</p>
      ${scene.note?`<div class="scene-note">${escapeHtml(scene.note)}</div>`:''}
      ${isChoice?'<div class="scene-note">Выбор меняет ракурс чтения, но не реальные события.</div>':''}
      <div class="panel-actions">${!end&&p.canGoBack?'<button class="subtle-btn" data-action="back-scene" aria-label="К предыдущей сцене">←</button>':''}${actions}</div>
    </section>
  </main>`;
}
function journalView() {
  const p=state.progress, decisions=p?.decisions||[];
  return `<main class="page journal-view">${header(p?'read':'library',p?'К чтению':'Главная')}
    <section class="journal-header"><div class="eyebrow">Бортовой журнал · 1990—1993</div><h1>Дневник<br>истории</h1><p class="journal-description">Даты и места из воспоминаний. Первую часть можно перечитать в любой момент.</p>
      <div class="kicker">Известные даты</div>
      <div class="milestone"><span class="index">19</span><div><strong>Ноябрь 1990 · военкомат</strong><p>Известие о трёхлетней службе в ВМФ.</p></div></div>
      <div class="milestone"><span class="index">19</span><div><strong>Вечер · поезд из Минска</strong><p>Через Симферополь — в Севастополь.</p></div></div>
      <div class="milestone"><span class="index">21</span><div><strong>Ночь · Севастополь</strong><p>Распределительный пункт, казарма, второй ярус.</p></div></div>
      <div class="milestone"><span class="index">25</span><div><strong>Ноябрь 1990 · распределительный пункт</strong><p>Экзамен у морпехов, отказ и уехавшая группа водолазов.</p></div></div>
      <div class="kicker" style="margin-top:25px">Твой путь</div>
      ${decisions.length?decisions.map((d,i)=>`<div class="milestone"><span class="index">0${i+1}</span><div><strong>${escapeHtml(d.summary)}</strong><p>Глава ${d.chapter}, часть ${d.part}</p></div></div>`).join(''):'<div class="journal-empty">Ты ещё не выбирал, на какой детали остановиться. Продолжай чтение.</div>'}
      <div style="margin-top:22px"><button class="btn wide" data-action="${p?'read':'chapters'}"><span class="btn-copy">${p?'Вернуться к чтению':'Открыть главу'}</span><span class="arrow">→</span></button></div>
    </section>
  </main>`;
}
function render() {
  root.innerHTML = `<div class="shell">${state.view === 'loading' ? `<div class="loading"><div>HIStory</div><small>Открываем архив…</small></div>` : state.view === 'error' ? `<main class="page">${header('library')}<div class="errorbox"><div class="eyebrow">НЕ УДАЛОСЬ ОТКРЫТЬ</div><h2>Приложение недоступно</h2><p>${escapeHtml(state.error)}</p><p style="font-size:12px;color:#a8b3b0">Для проверки в браузере запусти <code>npm run dev</code>. Для запуска внутри Telegram потребуется настроенный бот и HTTPS-адрес.</p><button class="btn wide" data-action="retry">Повторить <span>↻</span></button></div></main>` : state.view === 'library' ? libraryView() : state.view === 'chapters' ? chaptersView() : state.view === 'reader' ? readerView() : journalView()}</div>`;
}
async function openReader(targetPart = null) {
  state.progress = await api(`/api/story/${state.story.id}`);
  if (targetPart && targetPart > state.progress.part.number && state.progress.partCompleted && state.progress.scene.next) {
    state.progress = await api(`/api/story/${state.story.id}/advance`, { method: 'POST', body: JSON.stringify({ nodeId: state.progress.scene.id }) });
  }
  state.view = 'reader';
  render();
}
async function loadLibrary() {
  const data = await api('/api/bootstrap');
  state.stories = data.stories;
  state.story = data.stories.find(s => s.id === state.story?.id) || data.stories[0];
}
async function navigate(action, button) {
  if (state.busy) return;
  if (action === 'retry') return boot();
  if (action === 'locked') return toast('Эта часть появится после продолжения воспоминаний.');
  if (action === 'journal') { state.view = 'journal'; render(); return; }
  if (action === 'library') { await loadLibrary(); state.view = 'library'; render(); return; }
  if (action === 'chapters') { await loadLibrary(); state.view = 'chapters'; render(); return; }
  if (action === 'read') return openReader(Number(button.dataset.part) || null);
  if (action === 'restart') {
    if (!confirm('Начать первую часть заново? Текущий прогресс этой истории будет сброшен.')) return;
  }
  if (!['next','back-scene','choice','restart'].includes(action)) return;
  state.busy = true;
  try {
    const url = `/api/story/${state.story.id}/${action === 'next' || action === 'choice' ? 'advance' : action === 'back-scene' ? 'back' : 'reset'}`;
    const body = action === 'next' || action === 'choice' ? { nodeId: state.progress.scene.id, ...(action === 'choice' ? { choiceId: button.dataset.choice } : {}) } : {};
    const next = await api(url, { method: 'POST', body: JSON.stringify(body) });
    state.progress = next;
    state.view = 'reader';
    haptic();
    render();
  } catch (error) {
    toast(error.message);
    if (error.message.includes('уже пройдена')) {
      try { state.progress = await api(`/api/story/${state.story.id}`); render(); } catch { /* allow retry */ }
    }
  } finally { state.busy = false; }
}
root.addEventListener('click', async event => {
  const target = event.target.closest('[data-action]');
  if (!target || target.disabled) return;
  try { await navigate(target.dataset.action, target); }
  catch (error) { toast(error.message); }
});
document.addEventListener('keydown', event => {
  if (state.busy || state.view !== 'reader') return;
  if (event.key === 'ArrowRight' && state.progress?.scene?.type !== 'choice' && !state.progress.partCompleted) {
    event.preventDefault();
    navigate('next', {});
  } else if (event.key === 'ArrowLeft' && state.progress?.canGoBack) {
    event.preventDefault();
    navigate('back-scene', {});
  }
});
render();
boot();
</script></body></html>
